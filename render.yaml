# PayNova — Render demo deploy (single service, all modules in one container).
#
# WHY ONE SERVICE: PayNova's services talk to each other over localhost
# (payment API 6100, checkout 7000, admin 6001, observers 6002/6003). A
# multi-service Render setup would break those internal calls, so the whole
# gateway runs in one service and the public entry point is the demo store.
# The store reverse-proxies /checkout/* to the checkout portal, so a visitor
# only needs this one public URL to browse the store and reach checkout.
#
# HONEST LIMITS (demo, free tier):
# - Free instances sleep after ~15 min idle (~1 min wake on first visit).
# - SQLite data lives on the ephemeral filesystem: demo data resets on
#   redeploy/restart. Never use this demo for real school/merchant money.
# - Merchant admin (6001) and the raw API (6100) are NOT directly exposed
#   here — they run inside the container only. The admin panel IS reachable
#   through the store at /admin, behind HTTP Basic Auth
#   (ADMIN_DASHBOARD_USER / ADMIN_DASHBOARD_PASSWORD, set in the Render
#   dashboard — never in this file). The store strips the /admin prefix so
#   the admin page's own /api proxy (which injects ADMIN_API_KEY
#   server-side) keeps working, and direct /api/v1/admin/* calls without
#   that key are rejected by the payment API once ADMIN_API_KEY is set.
# - Real payment verification needs the owner's paired observers (Android
#   SMS app / Gmail OAuth) and WhatsApp OTP pairing; until those are paired,
#   checkout shows the login/QR flow but live UPI verification will not
#   complete. That pairing is the owner's step after deploy, not code.
services:
  - type: web
    name: paynova-demo
    env: node
    plan: free
    region: singapore
    buildCommand: npm install
    # Render injects $PORT; the store listens on it so Render's health check passes.
    startCommand: COIN_STORE_PORT=$PORT node scripts/dev.js
    envVars:
      - key: YOUPI_MODE
        value: localhost
      - key: NODE_ENV
        value: development
      - key: ADMIN_API_BASE
        value: /admin
      # Public demo addresses (NOT secrets — both are already shown on
      # checkout/admin). Seeding them here makes every Render reseed use
      # the live public URLs instead of localhost fallbacks, so the
      # webhook destination and the Gmail OAuth redirect survive deploys
      # without any dashboard env trip.
      - key: COIN_STORE_WEBHOOK_URL
        value: https://paynova-demo.onrender.com/api/webhook
      - key: GMAIL_REDIRECT_URI
        value: https://paynova-demo.onrender.com/gmail/oauth/callback
      # Dashboard-managed secrets (sync:false = Render dashboard owns the
      # value; the Blueprint never overwrites it). Set both in the Render
      # dashboard: ADMIN_DASHBOARD_PASSWORD = the password for /admin,
      # ADMIN_API_KEY = server-to-server key for the admin API surface.
      - key: ADMIN_DASHBOARD_USER
        value: admin
        sync: false
      - key: ADMIN_DASHBOARD_PASSWORD
        sync: false
      - key: ADMIN_API_KEY
        sync: false
    healthCheckPath: /
