<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register as Merchant · PayNova</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#eef4ff;color:#0f172a;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}
  main{width:100%;max-width:460px;background:#fff;border:1px solid #dbeafe;border-radius:16px;padding:32px;box-shadow:0 8px 30px rgba(11,99,229,.12)}
  .shield{width:56px;height:64px;margin:0 auto 16px;background:linear-gradient(135deg,#0ea5e9,#0b63e5);border-radius:10px 10px 22px 22px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:28px}
  h1{text-align:center;font-size:22px;margin:0 0 4px}
  p.sub{text-align:center;color:#64748b;font-size:14px;margin:0 0 24px}
  label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
  input{width:100%;padding:11px 12px;border:1.5px solid #cbd5e1;border-radius:10px;font-size:15px;box-sizing:border-box}
  input:focus{outline:none;border-color:#0b63e5;box-shadow:0 0 0 3px #bfdbfe}
  button{width:100%;margin-top:22px;padding:12px;background:#0b63e5;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer}
  button:disabled{opacity:.6}
  .err{display:none;margin-top:14px;padding:10px 12px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:10px;font-size:14px}
  .foot{text-align:center;margin-top:18px;font-size:14px;color:#64748b}
  .foot a{color:#0b63e5;font-weight:700;text-decoration:none}
  .theme-toggle{position:fixed;top:16px;right:16px;z-index:10;width:44px;height:44px;margin-top:0;padding:0;border-radius:50%;border:1.5px solid #cbd5e1;background:#fff;color:#0f172a;font-size:19px;cursor:pointer;box-shadow:0 4px 14px rgba(11,99,229,.15);line-height:1}
  /* MANUAL DARK MODE (applies ONLY under [data-theme="dark"]; light mode is untouched) */
  html[data-theme="dark"] body{background:#0b1120;color:#f1f5f9}
  html[data-theme="dark"] main{background:#0f172a;border-color:#1e293b;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  html[data-theme="dark"] p.sub,html[data-theme="dark"] .foot{color:#94a3b8}
  html[data-theme="dark"] input{background:#0b1120;border-color:#334155;color:#f1f5f9}
  html[data-theme="dark"] input:focus{border-color:#0b63e5;box-shadow:0 0 0 3px #1e3a8a}
  html[data-theme="dark"] .theme-toggle{background:#1e293b;border-color:#334155;color:#f1f5f9}
  html[data-theme="dark"] .foot a{color:#93c5fd}
</style>
<script>(function () { try { if (localStorage.getItem('paynova-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) { } })();</script>
</head>
<body>
<button type="button" class="theme-toggle" id="themeToggle" onclick="togglePaynovaTheme()" title="Toggle dark / light mode" aria-label="Toggle dark mode"><span id="themeToggleIcon">🌙</span></button>
<main>
  <div class="shield">P</div>
  <h1>Register as Merchant</h1>
  <p class="sub">Create your PayNova merchant account to accept UPI payments.</p>
  <form id="regForm">
    <label for="name">Your name</label>
    <input id="name" type="text" required autocomplete="name" />
    <label for="businessName">Business name</label>
    <input id="businessName" type="text" required autocomplete="organization" />
    <label for="email">Email</label>
    <input id="email" type="email" required autocomplete="email" />
    <label for="phone">Phone (optional)</label>
    <input id="phone" type="tel" autocomplete="tel" />
    <label for="password">Password (min 8 characters)</label>
    <input id="password" type="password" required minlength="8" autocomplete="new-password" />
    <label for="confirm">Confirm password</label>
    <input id="confirm" type="password" required minlength="8" autocomplete="new-password" />
    <div class="err" id="err"></div>
    <button type="submit" id="btn">Create merchant account</button>
  </form>
  <div class="foot">Already have an account? <a href="/merchant/login">Login</a></div>
</main>
<script>
  document.getElementById('regForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('err');
    const btn = document.getElementById('btn');
    err.style.display = 'none';
    const password = document.getElementById('password').value;
    if (password !== document.getElementById('confirm').value) {
      err.textContent = 'Passwords do not match.';
      err.style.display = 'block';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Creating account…';
    try {
      const res = await fetch('/merchant/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('name').value.trim(),
          businessName: document.getElementById('businessName').value.trim(),
          email: document.getElementById('email').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          password
        })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Registration failed.');
      window.location.href = '/merchant/dashboard';
    } catch (ex) {
      err.textContent = ex.message;
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Create merchant account';
    }
  });
</script>
<script>
  // MANUAL-ONLY THEME (key "paynova-theme", shared across PayNova pages on this host)
  (function () {
    function applyPaynovaTheme(theme) {
      var t = theme === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      var icon = document.getElementById('themeToggleIcon');
      if (icon) icon.textContent = t === 'dark' ? '☀️' : '🌙';
    }
    window.togglePaynovaTheme = function () {
      var cur = document.documentElement.getAttribute('data-theme') || 'light';
      var next = cur === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('paynova-theme', next); } catch (e) { }
      applyPaynovaTheme(next);
    };
    var saved = null;
    try { saved = localStorage.getItem('paynova-theme'); } catch (e) { }
    applyPaynovaTheme(saved === 'dark' ? 'dark' : 'light');
  })();
</script>
</body>
</html>
